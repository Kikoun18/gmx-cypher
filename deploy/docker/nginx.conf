# nginx for PMF Sequences (app/): a static site, served by a pod that runs as a non-root user on a read-only root
# filesystem. Everything nginx writes goes to /tmp, which the Deployment mounts as an emptyDir.

worker_processes 2;
pid /tmp/nginx.pid;
# The Dockerfile starts nginx with `-e stderr`, so even before this file is read nothing is opened under /var/log.
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  # nginx before 1.25 has no type for .mjs, and a browser refuses a module script without a JavaScript type.
  # Pyodide's loader (py/pyodide/pyodide.mjs) is one.
  types {
    text/javascript mjs;
  }
  default_type application/octet-stream;

  # The ingress in front logs every request; a static site adds nothing to that.
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Pyodide's wasm is about 9 MB; compressed it is about a third of that. (.zip and images are compressed already.)
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

  # Vite names every file in assets/ after its content, so those never change under their name. Everything else (the
  # page, the Python sandbox, Pyodide's files, which keep their names when Pyodide is upgraded) is asked about again
  # each time; nginx answers with its ETag and a 304 when nothing changed.
  map $uri $cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/img/    "public, max-age=86400";
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Not `always`: an error page must not be cached for a year because it sat under /assets/.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The Python sandbox is a hidden frame of the same origin; nobody else may frame the app.
    # This is deliberately not a full Content-Security-Policy: the app loads its fonts from jsdelivr and Google Fonts,
    # looks DOIs up at api.crossref.org, and 3Dmol uses eval, so a strict policy would break it. The sandbox page
    # carries its own, strict one (public/py/sandbox.html).
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # For the Deployment's probes. (A location with its own add_header drops the ones above, which suits it.)
    location = /healthz {
      default_type text/plain;
      add_header Cache-Control "no-store";
      return 200 "ok\n";
    }

    # The app routes with the #fragment, so a path that is not a file is simply not found.
    location / {
      try_files $uri $uri/index.html =404;
    }
  }
}
