# PMF Sequences without building an image: the stock nginx image, nginx.conf from a ConfigMap, and the site's files
# (app/dist) on a PersistentVolumeClaim that you fill with `kubectl cp`. Same Service and Ingress as the other
# variant. Steps: "Without Docker" in deploy/README.md. Use this folder or deploy/k8s/deployment.yaml, not both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pmf-sequences
  labels:
    app.kubernetes.io/name: pmf-sequences
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pmf-sequences
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pmf-sequences
    spec:
      # CERIT-SC runs only non-root containers.
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: pmf-sequences
          image: nginxinc/nginx-unprivileged:1.30-alpine
          # As in deploy/docker/Dockerfile: nginx itself, without the image's entrypoint scripts.
          command: ["nginx", "-e", "stderr"]
          args: ["-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # nginx writes only here.
            - name: tmp
              mountPath: /tmp
            # The site. nginx only reads it; it is writable so that `kubectl cp` can fill it.
            - name: site
              mountPath: /usr/share/nginx/html
            # deploy/docker/nginx.conf, from the ConfigMap (a change needs a restart of the pod).
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          # /healthz is answered by nginx itself, so the pod is Ready before the files are copied in
          # (the page says "not found" until then).
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: site
          persistentVolumeClaim:
            claimName: pmf-sequences-site
        - name: nginx-conf
          configMap:
            name: pmf-sequences-nginx
