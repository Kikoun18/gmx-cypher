# Where the built site (app/dist) lives. You fill it with `kubectl cp` (deploy/README.md, "Without Docker").
# It is the only thing here that holds files: delete this claim and the site's files go with it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pmf-sequences-site
  labels:
    app.kubernetes.io/name: pmf-sequences
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-csi
